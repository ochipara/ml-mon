[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-mon"
version = "0.1.0"
description = "Antigravity IDE conversation, Chain of Thought (CoT), and plan visualizer and monitor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Octav Chipara" },
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "watchfiles>=0.19.0",
]

[project.scripts]
gmon = "ml_mon.cli:main"
ml-mon = "ml_mon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_mon"]
